name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

env:
  AWS_REGION: eu-west-1
  TF_VERSION: 1.9.8
  PYTHON_VERSION: '3.13'

jobs:
  lint-python:
    name: Lint Python code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linters
        run: pip install ruff black

      - name: Run Ruff
        run: ruff check src/ || true

      - name: Run Black
        run: black --check src/ || true

  validate-terraform:
    name: Validate Terraform
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    env:
      # These become Terraform variables
      TF_VAR_alert_email: anass.lagraini94@gmail.com
      TF_VAR_project_name: weather-datalake-anass
      TF_VAR_environment: dev
      TF_VAR_region: eu-west-1
      TF_VAR_lambda_zip_path: "../dist/fetch_weather_data.zip"
      TF_VAR_layer_zip_path: "../dist/requests-layer.zip"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Create dummy zip files (CI doesn't build them)
        run: |
          mkdir -p dist
          echo "dummy" > dist/fetch_weather_data.zip
          echo "dummy" > dist/requests-layer.zip

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -input=false
        timeout-minutes: 3

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -no-color -input=false
        timeout-minutes: 5
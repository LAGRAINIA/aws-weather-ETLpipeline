name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

env:
  AWS_REGION: eu-west-1
  TF_VERSION: 1.6.0
  PYTHON_VERSION: '3.13'

jobs:
  lint-python:
    name: Lint Python code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linters
        run: pip install ruff black

      - name: Run Ruff
        run: ruff check src/ || true

      - name: Run Black
        run: black --check src/ || true

  validate-terraform:
    name: Validate Terraform
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show OIDC token subject
        run: |
          IDTOKEN=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | jq -r .value)
          echo "===== FULL OIDC CLAIMS ====="
          echo "$IDTOKEN" | cut -d'.' -f2 | base64 -d 2>/dev/null | python3 -m json.tool

      - name: Show role ARN being used (first 40 chars)
        run: |
          ARN='${{ secrets.AWS_DEPLOY_ROLE_ARN }}'
          echo "ARN length: ${#ARN}"
          echo "ARN starts with: ${ARN:0:40}"
          echo "ARN ends with: ${ARN: -30}"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -no-colors